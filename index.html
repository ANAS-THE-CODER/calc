<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10134b;
      color: #f5f6fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #222b46 0, #10131c 58%);
    }

    .calculator {
      width: min(100%, 370px);
      padding: 24px;
      border: 1px solid #ffffff12;
      border-radius: 28px;
      background: #191d29;
      box-shadow: 0 24px 70px #0008;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      color: #c9cde0;
      font-size: .85rem;
      font-weight: 650;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .badge {
      padding: 5px 9px;
      border-radius: 999px;
      background: #ffffff0c;
      color: #8f96b0;
      font-size: .7rem;
    }

    .display {
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      padding: 12px 4px 22px;
      text-align: right;
    }

    #expression {
      width: 100%;
      min-height: 24px;
      overflow: hidden;
      color: #969db7;
      font-size: 1rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #result {
      width: 100%;
      overflow: hidden;
      color: #f5f6fb;
      font-size: clamp(2.5rem, 12vw, 3.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 350;
      letter-spacing: -.055em;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }

    button {
      min-width: 0;
      aspect-ratio: 1.12;
      border: 0;
      border-radius: 17px;
      background: #252a39;
      color: #f3f4fa;
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 550;
      transition: background .15s, transform .12s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #30364a; }
    button:active { transform: scale(.95); }
    button:focus-visible { outline: 2px solid #aeb8ff; outline-offset: 3px; }

    button.utility {
      background: #303548;
      color: #c3c9df;
      font-size: 1rem;
    }

    button.operator {
      background: #292e40;
      color: #aeb8ff;
      font-size: 1.4rem;
    }

    button.operator[aria-pressed="true"] {
      background: #aeb8ff;
      color: #171a28;
    }

    button.equals {
      background: #8290f6;
      color: #101321;
      font-size: 1.45rem;
      box-shadow: 0 8px 20px #8290f633;
    }

    button.equals:hover { background: #9aa5ff; }
    button.zero { grid-column: span 2; aspect-ratio: auto; }

    .hint {
      margin: 18px 0 0;
      color: #777f99;
      font-size: .72rem;
      text-align: center;
    }

    @media (max-width: 360px) {
      .calculator { padding: 18px; }
      .keys { gap: 8px; }
      button { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header>
      <h1>Calculator</h1>
      <span class="badge">Standard</span>
    </header>

    <section class="display" aria-live="polite" aria-atomic="true" aria-label="Calculator display">
      <div id="expression"></div>
      <div id="result">0</div>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operator="÷" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="×" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="−" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </section>
    <p class="hint">Keyboard: 0–9, + − * /, Enter, Backspace</p>
  </main>

  <script>
    (() => {
      const resultDisplay = document.querySelector('#result');
      const expressionDisplay = document.querySelector('#expression');
      const keys = document.querySelector('.keys');
      let displayValue = '0';
      let storedValue = null;
      let pendingOperator = null;
      let startNewNumber = false;
      let justCalculated = false;

      function format(value) {
        if (!Number.isFinite(value)) return 'Error';
        const rounded = Number.parseFloat(value.toPrecision(11));
        const text = String(rounded);
        if (text.length <= 13) return text;
        return rounded.toExponential(6).replace(/\.?(\d*?)0*e/, '$1e');
      }

      function render() {
        resultDisplay.textContent = displayValue;
        expressionDisplay.textContent = storedValue !== null && pendingOperator
          ? `${format(storedValue)} ${pendingOperator}`
          : '';
        keys.querySelectorAll('[data-operator]').forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.operator === pendingOperator && !startNewNumber));
        });
      }

      function enterDigit(digit) {
        if (displayValue === 'Error' || startNewNumber || justCalculated) {
          displayValue = digit;
          startNewNumber = false;
          justCalculated = false;
        } else if (displayValue.replace('-', '').replace('.', '').length < 12) {
          displayValue = displayValue === '0' ? digit : displayValue + digit;
        }
        render();
      }

      function calculate(left, right, operator) {
        switch (operator) {
          case '+': return left + right;
          case '−': return left - right;
          case '×': return left * right;
          case '÷': return right === 0 ? NaN : left / right;
          default: return right;
        }
      }

      function chooseOperator(operator) {
        if (displayValue === 'Error') clear();
        const current = Number(displayValue);
        if (pendingOperator && !startNewNumber) {
          const next = calculate(storedValue, current, pendingOperator);
          displayValue = format(next);
          storedValue = Number.isFinite(next) ? next : null;
        } else {
          storedValue = current;
        }
        pendingOperator = operator;
        startNewNumber = true;
        justCalculated = false;
        render();
      }

      function equals() {
        if (!pendingOperator || storedValue === null || displayValue === 'Error') return;
        const left = storedValue;
        const right = Number(displayValue);
        const operator = pendingOperator;
        const answer = calculate(left, right, operator);
        expressionDisplay.textContent = `${format(left)} ${operator} ${format(right)} =`;
        displayValue = format(answer);
        storedValue = null;
        pendingOperator = null;
        startNewNumber = true;
        justCalculated = true;
        render();
        expressionDisplay.textContent = `${format(left)} ${operator} ${format(right)} =`;
      }

      function clear() {
        displayValue = '0';
        storedValue = null;
        pendingOperator = null;
        startNewNumber = false;
        justCalculated = false;
        render();
      }

      function performAction(action) {
        switch (action) {
          case 'clear': clear(); break;
          case 'decimal':
            if (displayValue === 'Error' || startNewNumber || justCalculated) {
              displayValue = '0.';
              startNewNumber = false;
              justCalculated = false;
            } else if (!displayValue.includes('.')) {
              displayValue += '.';
            }
            render();
            break;
          case 'sign':
            if (displayValue !== 'Error' && Number(displayValue) !== 0) {
              displayValue = displayValue.startsWith('-') ? displayValue.slice(1) : `-${displayValue}`;
              render();
            }
            break;
          case 'percent':
            if (displayValue !== 'Error') {
              displayValue = format(Number(displayValue) / 100);
              render();
            }
            break;
          case 'equals': equals(); break;
          case 'backspace':
            if (displayValue === 'Error' || startNewNumber || justCalculated) {
              displayValue = '0';
              startNewNumber = false;
              justCalculated = false;
            } else {
              displayValue = displayValue.length > 1 ? displayValue.slice(0, -1) : '0';
              if (displayValue === '-') displayValue = '0';
            }
            render();
            break;
        }
      }

      keys.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
        else if (button.dataset.operator) chooseOperator(button.dataset.operator);
        else if (button.dataset.action) performAction(button.dataset.action);
      });

      document.addEventListener('keydown', (event) => {
        if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
        else if (event.key === '.') performAction('decimal');
        else if (event.key === '+') chooseOperator('+');
        else if (event.key === '-') chooseOperator('−');
        else if (event.key === '*') chooseOperator('×');
        else if (event.key === '/') { event.preventDefault(); chooseOperator('÷'); }
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); equals(); }
        else if (event.key === 'Backspace') performAction('backspace');
        else if (event.key === 'Escape') clear();
        else if (event.key === '%') performAction('percent');
      });

      render();
    })();
  </script>
</body>
</html>
